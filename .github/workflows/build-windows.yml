name: Build & Publish Windows .exe

# Runs automatically whenever you push a version tag (e.g. v1.0.2), and can
# also be triggered manually from the Actions tab for a test build that
# does NOT publish a release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release when the build finishes?"
        type: boolean
        default: false

# Needed so electron-builder can create a GitHub Release and upload the
# .exe + latest.yml to it using the workflow's own built-in token — no
# separate GH_TOKEN secret needs to be created for this.
permissions:
  contents: write

jobs:
  build:
    # electron-builder needs to run ON Windows to produce a Windows
    # installer (NSIS) reliably, especially since this project's
    # Prisma engine binaryTargets includes "windows" and the packaged
    # app is meant to run natively there.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run electron:build

      # Two paths:
      #  - A pushed tag (v1.0.2 etc) always publishes a real release.
      #  - A manual run only publishes if the "publish" checkbox was ticked;
      #    otherwise it just builds the .exe as a downloadable workflow
      #    artifact, for testing a build without creating a public release.
      - name: Package & publish (tag push, or manual run with publish=true)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only, no publish (manual test run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        run: npx electron-builder --win --x64 --publish never

      - name: Upload build as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptionChainPulse-windows-build
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn
